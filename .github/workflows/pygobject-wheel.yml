# Builds PyGObject for Windows against the official GStreamer MSVC build.
# GStreamer's own bindings are tied to Python 3.9 (EOL), so lan-streamer ships
# its own wheel for a current Python; the setup script and installer use it.
name: PyGObject wheel (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pygobject-wheel.yml
      - src/lanstreamer/media/gst.py
      - src/lanstreamer/doctor.py

env:
  GST_VERSION: "1.28.6"
  PYGOBJECT_VERSION: "3.50.2"
  GST_ROOT: C:\gstreamer\1.0\msvc_x86_64

jobs:
  wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install GStreamer
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\gstreamer.exe"
          Invoke-WebRequest "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe" -OutFile $exe
          Start-Process -Wait -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$env:GST_ROOT"
          "$env:GST_ROOT\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$env:GST_ROOT\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$env:GST_ROOT" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build wheel
        shell: pwsh
        run: |
          pkg-config --modversion gobject-introspection-1.0 glib-2.0
          python -m pip install --upgrade pip
          python -m pip wheel "pygobject==$env:PYGOBJECT_VERSION" --no-deps --no-binary pygobject `
            --config-settings=setup-args=-Dpycairo=disabled -w dist

      - name: Smoke test
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem dist\*.whl).FullName
          python -m pip install -e ".[dev]"
          python -m lanstreamer.doctor --encoder cpu

      - uses: actions/upload-artifact@v4
        with:
          name: pygobject-${{ env.PYGOBJECT_VERSION }}-gst${{ env.GST_VERSION }}-win_amd64
          path: dist/*.whl
