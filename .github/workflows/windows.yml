# Windows CI.
# 1. Builds PyGObject against the official GStreamer MSVC build. GStreamer's own
#    bindings are tied to Python 3.9 (EOL), so lan-streamer ships its own wheel.
# 2. Runs scripts/install-windows.ps1 on a clean runner with that wheel.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  GST_VERSION: "1.28.6"
  PYGOBJECT_VERSION: "3.50.2"
  GST_ROOT: C:\gstreamer\1.0\msvc_x86_64

jobs:
  pygobject-wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install GStreamer
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\gstreamer.exe"
          Invoke-WebRequest "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe" -OutFile $exe
          Start-Process -Wait -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$env:GST_ROOT"
          "$env:GST_ROOT\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$env:GST_ROOT\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build wheel
        shell: pwsh
        run: |
          pkg-config --modversion gobject-introspection-1.0 glib-2.0
          python -m pip install --upgrade pip
          python -m pip wheel "pygobject==$env:PYGOBJECT_VERSION" --no-deps --no-binary pygobject `
            --config-settings=setup-args=-Dpycairo=disabled -w dist

      - uses: actions/upload-artifact@v4
        with:
          name: pygobject-win_amd64
          path: dist/*.whl

  install-script:
    needs: pygobject-wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: pygobject-win_amd64
          path: wheel

      - name: Run install-windows.ps1
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem wheel\*.whl).FullName
          ./scripts/install-windows.ps1 -Ref "${{ github.sha }}" `
            -PythonExe "${{ steps.python.outputs.python-path }}" -PyGObjectWheelPath $wheel
          $py = "$env:LOCALAPPDATA\lan-streamer\venv\Scripts\python.exe"
          & $py -m lanstreamer.doctor --encoder cpu
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Unit tests
        shell: pwsh
        run: |
          $py = "$env:LOCALAPPDATA\lan-streamer\venv\Scripts\python.exe"
          & $py -m pip install --quiet pytest
          & $py -m pytest -q
