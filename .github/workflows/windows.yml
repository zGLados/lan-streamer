# Windows CI: builds the test installer and installs it on a clean runner.
#
# GStreamer's own Python bindings are tied to Python 3.9 (EOL), so PyGObject is
# built here against the official GStreamer MSVC build and shipped in the installer.
name: Windows

# Runs only when started on purpose (owner 2026-10-26), not on every push to main:
#   - a full test run: push the commit to the branch "ci" (git push origin HEAD:ci)
#     or Actions → Windows → "Run workflow" (optionally with the doc screenshots)
#   - a release tag: build, install, self-test, update test and attach the files; the
#     rest only if this commit has no green full run yet (see the job "scope")
on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Also take the screenshots for the docs (artifact docs-images-…)"
        type: boolean
        default: false
  push:
    branches: [ci]
    tags: ["[0-9]*"]

concurrency:  # a newer push to "ci" replaces a run still going
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GST_VERSION: "1.28.6"
  PYGOBJECT_VERSION: "3.50.2"
  GST_ROOT: C:\gstreamer\1.0\msvc_x86_64
  # A release tag (e.g. 0.1.0, no "v": Debian versions start with a digit) builds that
  # version; anything else a test build of the version in development
  # (lanstreamer.__version__, checked by tests/test_version.py).
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-test.{1}', '0.1.3', github.run_number) }}
  NUM_VERSION: ${{ format('{0}.{1}', github.ref_type == 'tag' && github.ref_name || '0.1.3', github.run_number) }}
  # Test builds compress fast; release tags get the smallest installer.
  COMPRESSION: ${{ startsWith(github.ref, 'refs/tags/') && 'max' || 'fast' }}

jobs:
  # What this run checks. full: everything (unit tests, all end-to-end checks).
  # update: the real update test – for a release, a manual run, or when the updater
  # or the installer changed since the last push to "ci".
  scope:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      update: ${{ steps.scope.outputs.update }}
      screenshots: ${{ steps.scope.outputs.screenshots }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What to check
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHOTS: ${{ inputs.screenshots == true }}
        run: |
          full=true update=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            update=true
            # a green run of this workflow for the same commit, other than this tag's own
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=50" \
              --jq "[.workflow_runs[] | select(.head_branch != \"$GITHUB_REF_NAME\")] | length")
            if [ "$passed" -gt 0 ]; then full=false; fi
          elif [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "${BEFORE:-none}^{commit}" 2>/dev/null; then
            update=true  # manual run or unknown range
          elif git diff --name-only "$BEFORE" HEAD | grep -qE \
               '^(src/lanstreamer/updater\.py|packaging/windows/|tests/e2e/check_update\.py|\.github/workflows/windows\.yml)'; then
            update=true
          fi
          { echo "full=$full"; echo "update=$update"; echo "screenshots=$SHOTS"; } >> "$GITHUB_OUTPUT"
          echo "full checks: $full · update test: $update · doc screenshots: $SHOTS"

  build:
    needs: scope
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # GStreamer and the PyGObject wheel only change with their versions: cached.
      - uses: actions/cache@v4
        id: gst-cache
        with:
          path: C:\gstreamer
          key: gstreamer-msvc-${{ env.GST_VERSION }}

      - uses: actions/cache@v4
        id: wheel-cache
        with:
          path: wheels
          key: pygobject-${{ env.PYGOBJECT_VERSION }}-gst${{ env.GST_VERSION }}-cp313-win_amd64

      - name: Install GStreamer (build machine only)
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\gstreamer.exe"
          Invoke-WebRequest "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe" -OutFile $exe
          Start-Process -Wait -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$env:GST_ROOT"

      - name: GStreamer environment
        shell: pwsh
        run: |
          "$env:GST_ROOT\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$env:GST_ROOT\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Needed for the wheel build and for dumpbin in build.ps1
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build PyGObject wheel
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel "pygobject==$env:PYGOBJECT_VERSION" --no-deps --no-binary pygobject `
            --config-settings=setup-args=-Dpycairo=disabled -w wheels

      - name: Unit tests
        if: needs.scope.outputs.full != 'false'
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 -GstRoot $env:GST_ROOT `
            -PyGObjectWheel (Get-ChildItem wheels\*.whl).FullName `
            -Version $env:VERSION -NumVersion $env:NUM_VERSION -Compression $env:COMPRESSION

      - name: Test clip (H.264 + AAC in MP4) for the input tests
        if: needs.scope.outputs.full != 'false'
        shell: pwsh
        run: |
          gst-launch-1.0 -q videotestsrc num-buffers=300 pattern=ball `
            ! video/x-raw,width=1280,height=720,framerate=30/1 ! x264enc ! h264parse ! mp4mux name=m `
            ! filesink location=build/clip.mp4 `
            audiotestsrc num-buffers=430 freq=330 ! avenc_aac ! aacparse ! m.
          Get-Item build/clip.mp4 | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.full != 'false'
        with:
          name: testclip
          path: build/clip.mp4

      # only for the doc screenshots: on demand (workflow_dispatch) and for releases
      - name: Demo clips (60 s, with a title) for the screenshots in the docs
        if: needs.scope.outputs.screenshots == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/demo | Out-Null
          foreach ($clip in @(@('Highlights', 'smpte', 440), @('Intro', 'colors', 523), @('Finale', 'spokes', 659))) {
            $name, $pattern, $freq = $clip
            gst-launch-1.0 -q videotestsrc num-buffers=1800 pattern=$pattern `
              ! video/x-raw,width=1280,height=720,framerate=30/1 `
              ! textoverlay text=$name font-desc="Sans Bold 64" valignment=center halignment=center shaded-background=true `
              ! x264enc speed-preset=ultrafast ! h264parse ! mp4mux name=m ! filesink location=build/demo/$name.mp4 `
              audiotestsrc num-buffers=2813 freq=$freq volume=0.2 ! audio/x-raw,rate=48000 ! avenc_aac ! aacparse ! m.
          }
          Get-ChildItem build/demo | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.screenshots == 'true'
        with:
          name: democlips
          path: build/demo/*.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: lan-streamer-setup-${{ env.VERSION }}
          path: build/windows/lan-streamer-setup-*.exe
          compression-level: 0

  test-install:
    needs: [scope, build]
    runs-on: windows-latest
    timeout-minutes: 40  # incl. a real update (installer twice)
    steps:
      - uses: actions/checkout@v4  # only for tests/e2e

      - uses: actions/download-artifact@v4
        with:
          name: lan-streamer-setup-${{ env.VERSION }}
          path: setup

      - name: Install silently
        shell: pwsh
        run: |
          $exe = (Get-ChildItem setup\*.exe).FullName
          $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          # Listed under Settings > Apps / Programs and Features (all-users install)
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F0B7C55-3D1E-4C1B-9E3A-6C2B9A1F4E21}_is1'
          $entry = Get-ItemProperty $key
          Write-Host "Registered: $($entry.DisplayName) $($entry.DisplayVersion) in $($entry.InstallLocation)"
          # Start menu entries (all users) must point to a program, or Windows hides them
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\lan-streamer"
          $shell = New-Object -ComObject WScript.Shell
          $links = Get-ChildItem $menu -Filter *.lnk
          foreach ($l in $links) { $t = $shell.CreateShortcut($l.FullName); Write-Host "Start menu: $($l.BaseName) -> $($t.TargetPath) $($t.Arguments)" }
          if ((($links | ForEach-Object BaseName) -join ',') -ne 'lan-streamer') { throw "expected exactly the start menu entry 'lan-streamer' in $menu" }
          if ($links | Where-Object { $shell.CreateShortcut($_.FullName).TargetPath -notlike '*.exe' }) { throw 'a shortcut does not point to an .exe' }
          # The answers about the built-in inputs (silent: the defaults – test pattern off)
          $ini = Get-Content "$env:ProgramFiles\lan-streamer\setup.ini" -Raw
          Write-Host "setup.ini:`n$ini"
          foreach ($want in 'submissions=on', 'playlist=on', 'test-pattern=off') { if ($ini -notmatch [regex]::Escape($want)) { throw "setup.ini lacks $want" } }
          # Updates without an admin prompt: the task every user may start (runs as SYSTEM)
          schtasks.exe /Query /TN 'lan-streamer Update' /V /FO LIST | Select-String 'TaskName|Run As User|Task To Run'
          if ($LASTEXITCODE -ne 0) { throw "the task 'lan-streamer Update' is missing" }
          # Firewall rules for the LAN (private/domain networks)
          foreach ($rule in 'lan-streamer (MediaMTX)', 'lan-streamer (web page)', 'lan-streamer (web page, console)') {
            $shown = netsh advfirewall firewall show rule name="$rule" verbose
            if ($LASTEXITCODE -ne 0) { throw "firewall rule '$rule' missing" }
            $program = ($shown | Select-String 'Program:').ToString().Trim()
            Write-Host "Firewall: $rule -> $program"
            if ($program -notlike '*lan-streamer*') { throw "firewall rule '$rule' points elsewhere: $program" }
          }

      - name: Self-test of the installed app
        shell: pwsh
        run: |
          # No GPU on the runner: test the CPU encoder; the GPU candidates are probed and reported too.
          & "$env:ProgramFiles\lan-streamer\python\python.exe" -m lanstreamer.doctor
          & "$env:ProgramFiles\lan-streamer\python\python.exe" -m lanstreamer.doctor --encoder cpu
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install test tools (Playwright, httpx, websockets)
        shell: pwsh
        run: python -m pip install --quiet playwright httpx websockets

      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.full != 'false'
        with:
          name: testclip
          path: media

      - name: Windowless start (pythonw.exe --tray, stored configuration) + web API + admin page + viewer side + ingest + restream
        if: needs.scope.outputs.full != 'false'
        # a start error opens a message box in tray mode, which would wait for ever
        timeout-minutes: 12
        shell: pwsh
        run: |
          $dir = "$env:ProgramFiles\lan-streamer\python"
          & "$dir\python.exe" -c "import pydantic, pystray, PIL, fastapi, uvicorn, websockets, yt_dlp; print('dependencies ok')"
          & "$dir\python.exe" -m pip --version
          $p = Start-Process -PassThru -FilePath "$dir\pythonw.exe" `
            -ArgumentList '-m', 'lanstreamer', '--tray', '--no-browser', '--encoder', 'cpu', '--smoke-test', '360', `
              '--smoke-stop-file', "$env:RUNNER_TEMP\checks-done"
          python tests/e2e/check_api.py http://localhost:8080
          $api = $LASTEXITCODE
          python tests/e2e/check_admin.py http://localhost:8080
          $admin = $LASTEXITCODE
          # a viewer submits the test clip by link: real yt-dlp (updated on start) downloads it
          $web = Start-Process -PassThru -NoNewWindow -FilePath python -ArgumentList '-m', 'http.server', '8000', '--directory', 'media'
          python tests/e2e/check_viewer.py http://localhost:8080 --link http://127.0.0.1:8000/clip.mp4 --webrtc
          $viewer = $LASTEXITCODE
          # picture and sound from two URLs, as the YouTube input plays HD
          python tests/e2e/check_split_source.py http://localhost:8080 http://127.0.0.1:8000/clip.mp4
          $split = $LASTEXITCODE
          Stop-Process -Id $web.Id -ErrorAction SilentlyContinue
          # a live stream sent over SRT (like OBS) with the installed GStreamer
          python tests/e2e/check_ingest.py http://localhost:8080 "$dir\python.exe"
          $ingest = $LASTEXITCODE
          # the output sent on to an RTMP server (MediaMTX's own RTMP port stands in for YouTube/Twitch)
          python tests/e2e/check_restream.py http://localhost:8080
          $restream = $LASTEXITCODE
          New-Item -ItemType File "$env:RUNNER_TEMP\checks-done" | Out-Null  # the app ends now, not after 360 s
          $p.WaitForExit()
          Get-Content "$env:LOCALAPPDATA\lan-streamer\logs\lan-streamer.log" -Tail 15
          if ($api -ne 0) { throw "web API check failed" }
          if ($admin -ne 0) { throw "admin page check failed" }
          if ($viewer -ne 0) { throw "viewer side check failed" }
          if ($ingest -ne 0) { throw "ingest check failed" }
          if ($restream -ne 0) { throw "restream check failed" }
          if ($split -ne 0) { throw "separate picture/sound check failed" }
          $out = Get-Content "$env:LOCALAPPDATA\lan-streamer\logs\output.log"
          $overlay = $out | Select-String 'Overlay shown: .*submitted by CI viewer' | Select-Object -First 1
          Write-Host "Lower third: $overlay"
          if (-not $overlay) { $out | Select-Object -Last 20; throw "the submitted video got no lower third" }
          if ($out | Select-String 'Overlay failed') { throw "drawing the lower third failed" }
          if ($p.ExitCode -ne 0) { throw "windowless run failed ($($p.ExitCode))" }

      - name: Smoke test – stream with switching + playback in Edge (1080p60, CPU encoder)
        if: needs.scope.outputs.full != 'false'
        shell: pwsh
        run: |
          $py = "$env:ProgramFiles\lan-streamer\python\python.exe"
          # Inputs of equal priority: two test patterns (6 s each), a playlist with a
          # local 10 s MP4 and one with the same MP4 over HTTP (hand over when it ends)
          Copy-Item media/clip.mp4 media/clip-http.mp4
          $web = Start-Process -PassThru -NoNewWindow -FilePath python -ArgumentList '-m', 'http.server', '8000', '--directory', 'media'
          $clip = (Resolve-Path media/clip.mp4).Path
          $app = Start-Process -PassThru -NoNewWindow -FilePath $py `
            -ArgumentList '-m', 'lanstreamer', '--encoder', 'cpu', '--smoke-test', '45', '--switch-interval', '6', `
              '--source', $clip, '--source', 'http://127.0.0.1:8000/clip-http.mp4'
          python tests/e2e/check_player.py http://localhost:8080 --frames 300 --timeout 40
          $player = $LASTEXITCODE
          $app.WaitForExit()
          Stop-Process -Id $web.Id -ErrorAction SilentlyContinue
          $log = Get-Content "$env:LOCALAPPDATA\lan-streamer\logs\lan-streamer.log"
          $sent = $log | Select-String 'MPEG-TS sent:' | Select-Object -First 1
          Write-Host "First stream table sent to MediaMTX: $sent"
          if (-not ($sent -match 'H\.264') -or -not ($sent -match 'Opus')) { Write-Host 'stream table lacks H.264 or Opus'; exit 1 }
          foreach ($name in 'Test input A', 'Test input B', 'clip.mp4', 'clip-http.mp4') {
            if (-not ($log | Select-String "On air: $name")) { $log | Select-Object -Last 20; Write-Host "input $name never went on air"; exit 1 }
          }
          $mtx = Get-Content "$env:LOCALAPPDATA\lan-streamer\logs\mediamtx.log"
          $mtx | Select-Object -Last 15
          # Both tracks must reach MediaMTX, without decode errors.
          if (-not ($mtx | Select-String 'online, 2 tracks')) { Write-Host 'MediaMTX did not get 2 tracks'; exit 1 }
          if ($mtx | Select-String 'decode errors') { Write-Host 'MediaMTX reported decode errors'; exit 1 }
          if ($app.ExitCode -ne 0) { Write-Host "app smoke test failed ($($app.ExitCode))"; exit 1 }
          exit $player

      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.screenshots == 'true'
        with:
          name: democlips
          path: demo

      # Pictures for docs/images: a fresh setup (own data folder) with viewers, a queue
      # and the lower third. Never blocks a build or release – copied by hand when wanted.
      - name: Screenshots for the docs
        if: needs.scope.outputs.screenshots == 'true'
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\docs-data"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $web = Start-Process -PassThru -NoNewWindow -FilePath python -ArgumentList '-m', 'http.server', '8000', '--directory', 'demo'
          $app = Start-Process -PassThru -FilePath "$env:ProgramFiles\lan-streamer\python\pythonw.exe" `
            -ArgumentList '-m', 'lanstreamer', '--no-browser', '--encoder', 'cpu', '--smoke-test', '300', `
              '--smoke-stop-file', "$env:RUNNER_TEMP\docs-done"
          python tests/e2e/doc_screenshots.py http://localhost:8080 --media http://127.0.0.1:8000 `
            --playlist (Resolve-Path demo).Path --out docs-images
          $shots = $LASTEXITCODE
          New-Item -ItemType File "$env:RUNNER_TEMP\docs-done" | Out-Null
          $app.WaitForExit()
          Stop-Process -Id $web.Id -ErrorAction SilentlyContinue
          Get-Content "$env:LOCALAPPDATA\lan-streamer\logs\lan-streamer.log" -Tail 20
          if ($shots -ne 0) { throw "doc screenshots failed" }

      - name: Upload doc screenshots
        if: always() && needs.scope.outputs.screenshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-images-${{ env.VERSION }}
          path: docs-images
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ env.VERSION }}
          path: |
            player.png
            admin.png
            viewer.png
            tv.png

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.VERSION }}
          path: ~/AppData/Local/lan-streamer/logs

      # The updater for real: the installer just built is offered as version 99.0.0;
      # check, install (download, SHA-256, silent installer), restart by the installer.
      - name: Update through the admin API (installer offered as 99.0.0)
        if: needs.scope.outputs.update != 'false'
        timeout-minutes: 12
        shell: pwsh
        run: |
          $env:LANSTREAMER_UPDATE_FEED = 'http://127.0.0.1:8001/latest.json'  # for lan-streamer's check
          # the update task (SYSTEM) reads its address only from HKLM (admins only)
          New-Item -Path 'HKLM:\Software\lan-streamer' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\Software\lan-streamer' -Name UpdateFeed -Value 'http://127.0.0.1:8001/latest.json'
          $env:PYTHONIOENCODING = 'utf-8'  # the console's code page cannot print every character
          New-Item -ItemType Directory -Force update | Out-Null
          $web = Start-Process -PassThru -NoNewWindow -FilePath python -ArgumentList '-m', 'http.server', '8001', '--directory', 'update'
          Start-Process -FilePath "$env:ProgramFiles\lan-streamer\python\pythonw.exe" -ArgumentList '-m', 'lanstreamer', '--tray', '--no-browser', '--encoder', 'cpu' | Out-Null
          python tests/e2e/check_update.py http://localhost:8080 --installer (Get-ChildItem setup\*.exe).FullName `
            --dir update --feed-url http://127.0.0.1:8001
          $code = $LASTEXITCODE
          Stop-Process -Id $web.Id -ErrorAction SilentlyContinue
          Get-Content "$env:LOCALAPPDATA\lan-streamer\logs\lan-streamer.log" -Tail 25
          Write-Host "--- update task result and installer log"
          Get-Content "$env:ProgramFiles\lan-streamer\updates\result.json" -ErrorAction SilentlyContinue
          Get-Content "$env:ProgramFiles\lan-streamer\updates\install.log" -Tail 60 -ErrorAction SilentlyContinue
          Write-Host "--- relauncher"
          Get-Content "$env:LOCALAPPDATA\lan-streamer\logs\relaunch.log" -ErrorAction SilentlyContinue
          Remove-Item -Path 'HKLM:\Software\lan-streamer' -Recurse -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.Name -like 'lan-streamer-setup*' -or $_.Name -like '*.tmp' } | Format-Table Id, Name, Path
          # the restarted lan-streamer must go before the uninstall
          Get-Process pythonw, python, mediamtx -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -like "$env:ProgramFiles\lan-streamer\*" } | Stop-Process -Force
          if ($code -ne 0) { throw "update check failed" }

      - name: Upload update logs
        if: always() && needs.scope.outputs.update != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: logs-update-${{ env.VERSION }}
          path: ~/AppData/Local/lan-streamer/logs
          if-no-files-found: ignore

      - name: Uninstall
        shell: pwsh
        run: |
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F0B7C55-3D1E-4C1B-9E3A-6C2B9A1F4E21}_is1'
          $p = Start-Process -Wait -PassThru -FilePath "$env:ProgramFiles\lan-streamer\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Start-Sleep 3
          if (Test-Path $key) { throw 'uninstall entry still registered' }
          schtasks.exe /Query /TN 'lan-streamer Update' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the task 'lan-streamer Update' was left behind" }
          foreach ($rule in 'lan-streamer (MediaMTX)', 'lan-streamer (web page)', 'lan-streamer (web page, console)') {
            netsh advfirewall firewall show rule name="$rule" | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "firewall rule '$rule' left behind" }
          }
          $global:LASTEXITCODE = 0
          foreach ($dir in "$env:ProgramFiles\lan-streamer", "$env:LOCALAPPDATA\lan-streamer") {
            if (Test-Path $dir) { Get-ChildItem -Recurse $dir | Select-Object -First 20 FullName; throw "uninstall left $dir behind" }
          }

  # Release tag: the installer and the example plugins go to the GitHub release
  # (created beforehand, e.g. as a draft, with the notes from CHANGELOG.md).
  release:
    if: github.ref_type == 'tag'
    needs: test-install
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lan-streamer-setup-${{ env.VERSION }}
          path: dist

      - name: Example plugins as upload-ready zips
        run: |
          python3 -m venv .venv && .venv/bin/pip install -q "pydantic>=2.7"
          for example in examples/*/; do
            PYTHONPATH=src .venv/bin/python -m lanstreamer_sdk pack "$example" -o "dist/example-$(basename "$example")-$VERSION.zip"
          done
          ls -la dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
