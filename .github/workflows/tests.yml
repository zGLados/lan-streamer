# Quick checks for pull requests: ruff and the unit tests, on both platforms.
# The full test (installers, real video pipeline, browser playback) stays in linux.yml and
# windows.yml, started on purpose. Pull requests from forks get no secrets and no write rights.
name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:  # a newer push to the pull request replaces a run still going
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Ruff and unit tests
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m pytest -q
