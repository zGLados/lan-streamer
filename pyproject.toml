[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lanstreamer"
version = "0.1.4"
description = "Self-hosted modular LAN streaming platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# PyGObject is not listed: the Windows installer ships its own build, on Linux
# it comes from the distribution packages.
dependencies = [
    "pydantic>=2.7",
    # web API: FastAPI on uvicorn, websockets for live status
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    # built-in "submissions" input (updates itself on start, see its plugin)
    "yt-dlp>=2025.1",
    # tray icon on Windows
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "pyyaml>=6"]  # pyyaml: tests/test_ci.py

[tool.hatch.build.targets.wheel]
packages = ["src/lanstreamer", "src/lanstreamer_sdk"]
artifacts = ["src/lanstreamer/BUILD"]  # build version from packaging/linux/build.sh (git-ignored)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]  # examples: the template plugin's own tests
